id = "flatppl"
name = "FlatPPL"
version = "0.0.1"
schema_version = 1
description = "FlatPPL language support for Zed (tree-sitter)."
repository = "https://github.com/flatppl/flatppl-grammars"

# Zed builds the grammar from the tree-sitter target in this repo's subdir.
# Pin a commit for reproducibility.
[grammars.flatppl]
repository = "https://github.com/flatppl/flatppl-grammars"
commit = "REPLACE_WITH_COMMIT_SHA"
path = "tree-sitter"
