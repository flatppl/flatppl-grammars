[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<4"
pandoc = ">=3.9,<4"
pip = "*"
pre-commit = ">=4,<5"
nodejs = ">=24,<25"
pygments = ">=2.17,<3"
rust = ">=1.96.0,<1.97"

[tasks]
gen-grammars = "python tools/gen-grammars.py"
check-grammars = "python tools/gen-grammars.py --check"
# Local-only: verify keyword-lists.json covers every builtin in the spec docs
# (flatppl-design). Skips with exit 0 when the docs repo is not checked out, so
# it is intentionally NOT part of the CI `check` aggregate.
check-spec-keywords = "python tools/check-spec-keywords.py"
# Smoke-test the generated Pygments lexer. cwd=pygments so `import flatppl_lexer`
# resolves; Pygments comes from the pixi env (no install needed).
test-pygments = { cmd = "python test_lexer.py", cwd = "pygments" }
# Verify the entry point resolves AFTER `pixi run pip install -e ./pygments`.
# Run from repo root (no cwd) so only the installed entry point can resolve the
# lexer. NOT in `check` — that runs without the editable install; CI runs it
# separately after installing (see .github/workflows/check-grammars.yml).
test-pygments-entrypoint = "python pygments/test_entrypoint.py"
test-kate = "bash kate/test/check.sh"
# Scope-regression test for the Sublime/syntect grammar (bat, ranger previews).
# Tokenizes snippets with syntect + Oniguruma — the SAME engine bat uses — and
# asserts each category lands on its expected scope. Behavioural twin of
# test-textmate/test-pygments/test-kate. Keyword sync + GEN markers are guarded
# separately by check-grammars (gen-grammars.py --check).
test-sublime = { cmd = "cargo run --quiet", cwd = "sublime/test" }
# `npm ci` installs EXACTLY the committed package-lock pins for the TextMate
# scope-regression test (vscode-textmate + vscode-oniguruma).
npm-install-textmate = { cmd = "npm ci", cwd = "textmate/test" }
# Tokenize FlatPPL snippets with vscode-textmate (the engine VS Code uses) and
# assert each category lands on its expected scope. Guards textmate/flatppl.tmLanguage.json.
test-textmate        = { cmd = "node check.mjs", cwd = "textmate/test", depends-on = ["npm-install-textmate"] }
# Verify the embedding grammars (flatppl in python/julia/markdown) inject FlatPPL
# via vscode-textmate — the engine VS Code uses (editors/vscode). Same dep as
# test-textmate. Guards textmate/flatppl-{python,julia,markdown}.tmLanguage.json.
test-embedding       = { cmd = "node check-embedding.mjs", cwd = "textmate/test", depends-on = ["npm-install-textmate"] }
# `npm ci` (not `npm install`) installs EXACTLY the package-lock pins and wipes any
# stale node_modules, preventing tree-sitter-cli version skew — a stale CLI loading
# a newer committed parser.c was the root cause of a multi-GB OOM in the
# `tree-sitter test` runner. --ignore-scripts skips the package's own native binding
# build (not needed for generate/test) and tree-sitter-cli's postinstall binary
# download; `npm rebuild` re-runs that one package's install script to fetch it.
npm-install       = { cmd = "npm ci --ignore-scripts && npm rebuild tree-sitter-cli", cwd = "tree-sitter" }
# Fail fast (with a clear "run npm ci" message) if the installed CLI cannot load
# the committed parser due to LANGUAGE_VERSION/ABI skew, BEFORE running anything heavy.
check-toolchain   = { cmd = "bash test/check-toolchain.sh", cwd = "tree-sitter", depends-on = ["npm-install"] }
gen-tree-sitter   = { cmd = "npx tree-sitter generate", cwd = "tree-sitter", depends-on = ["check-toolchain"] }
# Corpus runner wrapped in the 700MB RSS cap (see test/run-capped.sh) so the
# `tree-sitter test` runner can never OOM the machine.
test-tree-sitter   = { cmd = "bash test/run-capped.sh bash test/run-corpus.sh", cwd = "tree-sitter", depends-on = ["gen-tree-sitter"] }
# Stress harness (500MB cap). Depends on test-tree-sitter so the two NEVER run
# concurrently — tests are serialized end to end (gen -> corpus -> stress).
stress-tree-sitter = { cmd = "bash test/stress/run-stress.sh", cwd = "tree-sitter", depends-on = ["test-tree-sitter"] }
# Highlight-scope regression check via `tree-sitter query` (~6MB), NOT
# `tree-sitter test` — the latter's highlight-assertion phase balloons RSS
# (180MB -> 735MB from a few assertions, past the CI cap). Chained AFTER stress
# so all tree-sitter runs stay serialized (never concurrent -> never OOM).
# Asserts §05 axis variance markers ^/_ are captured as @property, not operators.
test-highlight-query = { cmd = "bash test/run-capped.sh bash test/query/check.sh", cwd = "tree-sitter", depends-on = ["stress-tree-sitter"] }
check-tree-sitter  = { depends-on = ["test-highlight-query"] }
check             = { depends-on = ["check-grammars", "test-pygments", "test-kate", "test-sublime", "test-textmate", "test-embedding", "check-tree-sitter"] }
# Editor-integration verifiers. Need the editor + its prereqs installed (emacs
# 29+ with tree-sitter + a C compiler; neovim with nvim-treesitter and the
# python/julia parsers — see editors/{emacs,nvim}/README.md). Each SKIPS with
# exit 0 when its editor is absent, so they are safe to run anywhere — and for
# that same reason are intentionally NOT in `check`/CI (those runners have no
# editors and would only ever skip). Run locally: `pixi run verify-editors`.
verify-emacs   = "bash editors/emacs/test/verify.sh"
verify-nvim    = "bash editors/nvim/test/run.sh"
verify-editors = { depends-on = ["verify-emacs", "verify-nvim"] }
