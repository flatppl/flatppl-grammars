[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<4"
pandoc = ">=3.9,<4"

[tasks]
gen-grammars = "python tools/gen-grammars.py"
check-grammars = "python tools/gen-grammars.py --check"
test-kate = "bash kate/test/check.sh"
check = { depends-on = ["check-grammars", "test-kate"] }
