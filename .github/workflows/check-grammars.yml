name: Check grammars

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.8

      - name: Check keyword lists in sync
        run: pixi run check-grammars

      - name: Test Kate highlighting
        run: pixi run test-kate

      - name: Test tree-sitter grammar
        run: pixi run check-tree-sitter
