name: Check grammars

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check out flatppl-design (spec source)
        uses: actions/checkout@v6.0.2
        with:
          repository: flatppl/flatppl-design
          ref: main
          path: .design

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.6

      - name: Check keyword lists in sync
        run: pixi run check-grammars

      - name: Spec builtins/combinators/kernels are mirrored in keyword-lists
        env:
          FLATPPL_DOCS_DIR: ${{ github.workspace }}/.design/docs
        run: pixi run check-spec-keywords

      - name: Generator is idempotent (no uncommitted drift)
        run: |
          pixi run gen-grammars
          git diff --exit-code

      - name: Test Pygments lexer
        run: pixi run test-pygments

      - name: Pygments entry point resolves (editable install)
        run: |
          pixi run pip install -e ./pygments
          pixi run test-pygments-entrypoint

      - name: Test Kate highlighting
        run: pixi run test-kate

      - name: Test Sublime/syntect grammar
        run: pixi run test-sublime

      - name: Test TextMate highlighting
        run: pixi run test-textmate

      - name: Test tree-sitter grammar
        run: pixi run check-tree-sitter

      - name: tree-sitter parser is up to date (no stale committed src)
        run: git diff --exit-code tree-sitter/src
